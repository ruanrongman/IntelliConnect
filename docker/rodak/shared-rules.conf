rule_engine.rules.rodak_events {
  sql = """SELECT event, clientid, username, topic, timestamp, client_attrs FROM "$events/client_connected", "$events/client_disconnected", "$events/session_subscribed", "$events/session_unsubscribed" WHERE is_not_null(client_attrs.rodak_id)"""
  actions = [{
    function = republish
    args {
      topic = "_rodak/events/${event}"
      qos = 1
      retain = false
      payload = "${.}"
    }
  }]
}

rule_engine.rules.rodak_payload {
  sql = """SELECT clientid, username, topic, timestamp, client_attrs, payload FROM "devices/+/telemetry", "devices/+/shadow/report", "devices/+/commands/+/ack" WHERE is_not_null(client_attrs.rodak_id)"""
  actions = [{
    function = republish
    args {
      topic = "_rodak/events/message.publish"
      qos = 1
      retain = false
      payload = "${.}"
    }
  }]
}
